name: CI

# Offline suite: no API key, no network after install, no XFoil binary
# (tests marked `xfoil` are deselected; they run locally after `make xfoil`).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check swarm tests
      - run: uv run ruff format --check swarm tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      AEROSWARM_ANTHROPIC_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest -q -m "not xfoil" -rs
