<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AeroSwarm Run Viewer</title>
<meta name="description" content="Replay of a multi-agent LLM optimization of a race-car wing section: agent decisions, wing morph and Cl–Cd polar, from the run ledger.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 18 C9 10 22 9 29 13 C22 16 10 19 3 18Z' fill='%2336c2b4'/%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 18 C9 10 22 9 29 13 C22 16 10 19 3 18Z"/></svg>
    <div>
      <h1>AeroSwarm</h1>
      <p>Multi-agent wing optimization: replay</p>
    </div>
  </div>
  <div class="top-mid">
    <span id="source-chip" class="chip chip-source" title="Where the data on screen comes from">Recorded run</span>
    <span id="label-chip" class="chip"></span>
  </div>
  <div class="top-right">
    <label class="sr-only" for="run-select">Run</label>
    <select id="run-select" aria-label="Run"></select>
    <button id="theme-toggle" class="icon-btn" title="Toggle light / dark" aria-label="Toggle light or dark theme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
    </button>
  </div>
</header>

<main class="grid">
  <!-- LEFT: start design, nearest run, run facts -->
  <section class="panel left" aria-labelledby="h-start">
    <div class="panel-head">
      <h2 id="h-start">Start design</h2>
      <span class="hint">drag a dial</span>
    </div>
    <div id="dials" class="dials"></div>
    <div id="nearest" class="nearest" aria-live="polite"></div>

    <div class="panel-head sub"><h2>Target</h2></div>
    <dl id="spec" class="facts"></dl>

    <div class="panel-head sub"><h2>Run</h2></div>
    <dl id="run-facts" class="facts"></dl>
    <div id="baseline" class="baseline"></div>
  </section>

  <!-- CENTER: wing stage + polar -->
  <section class="center">
    <div class="panel stage-panel">
      <div class="stage-head">
        <div class="gen-badge"><span class="k">GEN</span><span id="gen-num">0</span><span class="of" id="gen-of">/ 0</span></div>
        <div id="stage-status" class="status"></div>
        <div class="readout">
          <div><span class="k">Cl</span><span id="ro-cl" class="v">—</span></div>
          <div><span class="k">Cd</span><span id="ro-cd" class="v">—</span></div>
          <div><span class="k">Solver</span><span id="ro-solver" class="v">—</span></div>
          <div><span class="k">Stall margin</span><span id="ro-stall" class="v">—</span></div>
        </div>
      </div>
      <div id="banner" class="banner" hidden></div>
      <svg id="stage" class="stage" role="img" aria-label="Wing section at the current generation"></svg>
      <div id="stage-foot" class="stage-foot"></div>
    </div>
    <div class="panel polar-panel">
      <div class="panel-head">
        <h2>Cl–Cd polar</h2>
        <div class="legend" id="polar-legend"></div>
      </div>
      <div class="polar-wrap">
        <svg id="polar" class="polar" role="img" aria-label="Evaluated designs on a lift–drag plot with the target box"></svg>
        <div id="tip" class="tip" hidden></div>
      </div>
    </div>
  </section>

  <!-- RIGHT: agent decision feed -->
  <section class="panel right" aria-labelledby="h-feed">
    <div class="panel-head">
      <h2 id="h-feed">Agent decisions</h2>
      <span class="hint">verbatim from traces.jsonl</span>
    </div>
    <div id="feed" class="feed" aria-live="polite"></div>
  </section>
</main>

<footer class="timeline panel">
  <div class="controls">
    <button id="btn-restart" class="icon-btn" title="Restart" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button id="btn-prev" class="icon-btn" title="Previous generation" aria-label="Previous generation"><svg viewBox="0 0 24 24"><path d="M15 5v14L6 12z"/></svg></button>
    <button id="btn-play" class="icon-btn play" title="Play / pause (space)" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path id="play-icon" d="M7 5v14l12-7z"/></svg></button>
    <button id="btn-next" class="icon-btn" title="Next generation" aria-label="Next generation"><svg viewBox="0 0 24 24"><path d="M9 5v14l9-7z"/></svg></button>
    <div class="speed" role="group" aria-label="Replay speed">
      <button data-speed="0.5">0.5×</button><button data-speed="1">1×</button><button data-speed="2" class="on">2×</button><button data-speed="4">4×</button>
    </div>
    <button id="btn-morph" class="pill" title="Morph from the start design to the final design">Start → final</button>
  </div>
  <div class="scrub">
    <div id="ticks" class="ticks" aria-hidden="true"></div>
    <input id="scrubber" type="range" min="0" max="0" step="1" value="0" aria-label="Generation">
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
