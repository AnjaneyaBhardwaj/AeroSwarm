[project]
name = "aero-swarm"
version = "0.1.0"
description = "Multi-agent LLM optimization of a race-car wing section against Cl/Cd targets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "imageio>=2.34",
    "aerosandbox>=4.2",
    "neuralfoil>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "anthropic>=0.60",
    "optuna>=5.0.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swarm"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["xfoil: needs the real xfoil binary (skipped if missing)"]
